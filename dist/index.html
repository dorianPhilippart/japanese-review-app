<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="Révise le vocabulaire et les kanji japonais avec des quiz courts et interactifs.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Kanji Sprint</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="Accueil Kanji Sprint">
        <span class="brand-mark">間</span>
        <span>Kanji Sprint</span>
      </button>
      <div class="streak" aria-label="Série actuelle"><span>🔥</span><strong id="streakCount">0</strong></div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-item active" data-go="home"><span class="nav-icon">⌂</span><span>Accueil</span></button>
      <button class="nav-item" data-go="quick"><span class="nav-icon">⚡</span><span>Quiz</span></button>
      <button class="nav-item" data-go="progress"><span class="nav-icon">◔</span><span>Progrès</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
