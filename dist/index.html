<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="Révise le vocabulaire et les kanji japonais avec des quiz courts et interactifs.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kanji Sprint">
  <link rel="manifest" href="manifest.webmanifest?v=7">
  <link rel="icon" href="icon.svg?v=7" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=7">
  <link rel="stylesheet" href="styles.css?v=13">
  <title>Kanji Sprint</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="Accueil Kanji Sprint" data-translate-label="Accueil Kanji Sprint">
        <img class="brand-mark" src="icon.svg?v=7" alt="" width="36" height="36">
        <span>Kanji Sprint</span>
      </button>
      <div class="top-actions">
        <button class="install-pill" id="installButton" hidden data-translate="Installer">Installer</button>
        <button class="account-pill" id="accountButton" data-go="account" aria-label="Compte et synchronisation" data-translate-label="Compte et synchronisation">☁</button>
        <div class="streak" aria-label="Série actuelle" data-translate-label="Série actuelle"><span>🔥</span><strong id="streakCount">0</strong></div>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navigation principale" data-translate-label="Navigation principale">
      <button class="nav-item active" data-go="home" aria-current="page"><span class="nav-icon">⌂</span><span data-translate="Accueil">Accueil</span></button>
      <button class="nav-item" data-go="quick"><span class="nav-icon">⚡</span><span>Quiz</span></button>
      <button class="nav-item" data-go="library"><span class="nav-icon">本</span><span data-translate="Cartes">Cartes</span></button>
      <button class="nav-item" data-go="guide"><span class="nav-icon" aria-hidden="true">旅</span><span data-translate="Guide">Guide</span></button>
      <button class="nav-item" data-go="progress"><span class="nav-icon">◔</span><span data-translate="Progrès">Progrès</span></button>
    </nav>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }
  </script>
  <script src="supabase.js?v=7"></script>
  <script src="config.js?v=7"></script>
  <script src="extra-cards.js?v=11"></script>
  <script src="vocabulary-en.js?v=11"></script>
  <script src="i18n.js?v=13"></script>
  <script src="kanji.js?v=10"></script>
  <script src="vocabulary-reference.js?v=12"></script>
  <script src="guide-data.js?v=13"></script>
  <script src="guide.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
