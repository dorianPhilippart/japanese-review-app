<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="Révise le vocabulaire et les kanji japonais avec des quiz courts et interactifs.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kanji Sprint">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=6">
  <title>Kanji Sprint</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="Accueil Kanji Sprint">
        <span class="brand-mark">間</span>
        <span>Kanji Sprint</span>
      </button>
      <div class="top-actions">
        <button class="install-pill" id="installButton" hidden>Installer</button>
        <button class="account-pill" id="accountButton" data-go="account" aria-label="Compte et synchronisation">☁</button>
        <div class="streak" aria-label="Série actuelle"><span>🔥</span><strong id="streakCount">0</strong></div>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-item active" data-go="home"><span class="nav-icon">⌂</span><span>Accueil</span></button>
      <button class="nav-item" data-go="quick"><span class="nav-icon">⚡</span><span>Quiz</span></button>
      <button class="nav-item" data-go="library"><span class="nav-icon">本</span><span>Cartes</span></button>
      <button class="nav-item" data-go="progress"><span class="nav-icon">◔</span><span>Progrès</span></button>
    </nav>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }
  </script>
  <script src="supabase.js?v=6"></script>
  <script src="config.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
